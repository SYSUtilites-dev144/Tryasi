<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AR Текст 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); color: white; z-index: 10;
      flex-direction: column; text-align: center; padding: 20px;
    }
    button {
      padding: 15px 30px; font-size: 18px; margin-top: 20px;
      background: #4dc3ff; border: none; border-radius: 8px; cursor: pointer;
    }
    #info {
      position: absolute; bottom: 20px; left: 0; right: 0;
      text-align: center; color: white; font-size: 14px;
      pointer-events: none; opacity: 0.8;
    }
  </style>
  <!-- Подключаем Three.js и WebXR Helpers -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<div id="overlay">
  <h1>AR Текст 3D</h1>
  <p>Наведи камеру на пол, чтобы разместить текст.<br>Потом ходи вокруг него!</p>
  <button id="startBtn">Запустить AR</button>
</div>
<div id="info">Ищи пол...</div>

<script type="module">
  import * as THREE from 'three';
  import { ARButton } from 'three/addons/webxr/ARButton.js';
  import { FontLoader } from 'three/addons/loaders/FontLoader.js';
  import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

  let container, camera, scene, renderer;
  let controller;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;
  let textMesh = null;
  let placed = false;

  init();
  animate();

  function init() {
    container = document.createElement('div');
    document.body.appendChild(container);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    // Освещение
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    // Рендерер с поддержкой XR
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // Кнопка AR (встроенная из Three.js)
    const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
    document.body.appendChild(arButton);
    
    // Скрываем наш оверлей при старте AR
    arButton.addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
    });

    // Контроллер (для понимания позиции)
    controller = renderer.xr.getController(0);
    scene.add(controller);

    // Ретикул (прицел для размещения)
    reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial()
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Загрузка шрифта и создание текста
    const loader = new FontLoader();
    // Используем стандартный шрифт из примеров Three.js
    loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
      const geometry = new TextGeometry('HELLO\nWORLD', {
        font: font,
        size: 0.5,
        height: 0.1,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.02,
        bevelOffset: 0,
        bevelSegments: 5
      });
      
      geometry.center(); // Центрируем геометрию

      const material = new THREE.MeshPhongMaterial({ 
        color: 0x4dc3ff, 
        emissive: 0x112244,
        shininess: 100
      });
      
      textMesh = new THREE.Mesh(geometry, material);
      textMesh.rotation.x = -Math.PI / 2; // Положим горизонтально сначала
      textMesh.visible = false; // Скрыт пока не поставим
      scene.add(textMesh);
    });

    window.addEventListener('resize', onWindowResize);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render(timestamp, frame) {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (hitTestSourceRequested === false) {
        session.requestReferenceSpace('viewer').then(function (referenceSpace) {
          session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
            hitTestSource = source;
          });
        });

        session.addEventListener('end', function () {
          hitTestSourceRequested = false;
          hitTestSource = null;
          placed = false;
          document.getElementById('overlay').style.display = 'flex';
        });

        hitTestSourceRequested = true;
      }

      if (hitTestSource) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          reticle.visible = true;
          reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          document.getElementById('info').textContent = placed ? "Ходи вокруг текста!" : "Тапни по экрану, чтобы поставить текст";

          // Если еще не поставили текст, обновляем позицию ретикула
          if (!placed && textMesh) {
             // Просто показываем где будет текст
          }
        } else {
          reticle.visible = false;
          document.getElementById('info').textContent = "Ищи пол...";
        }
      }
    }

    renderer.render(scene, camera);
  }

  // Обработка тапа для размещения
  window.addEventListener('touchstart', (e) => {
    if (reticle.visible && !placed && textMesh) {
      placed = true;
      textMesh.visible = true;
      // Ставим текст туда, где ретикул, но поднимаем чуть вверх и поворачиваем вертикально
      textMesh.position.setFromMatrixPosition(reticle.matrix);
      textMesh.position.y += 0.5; // Поднимаем над полом
      textMesh.rotation.set(0, 0, 0); // Вертикально
      textMesh.lookAt(camera.position); // Поворачиваем к камере изначально
      
      // Анимация появления
      textMesh.scale.set(0,0,0);
      let s = 0;
      const grow = setInterval(() => {
        s += 0.1;
        textMesh.scale.set(s,s,s);
        if(s >= 1) clearInterval(grow);
      }, 16);
    }
  });

</script>
</body>
</html>
